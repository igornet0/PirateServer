[package]
name = "pirate-host-agent"
version = "0.1.1"
edition = "2021"
description = "Out-of-band HTTP agent for server-stack OTA and host reboot"

[[bin]]
name = "pirate-host-agent"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "signal", "net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = { workspace = true }
hex = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
deploy-core = { path = "../deploy-core" }
subtle = "2"
axum-server = { version = "0.8", features = ["tls-rustls"] }
