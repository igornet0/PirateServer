[package]
name = "deploy-control"
version = "0.1.6"
edition = "2021"
description = "Control-plane logic for deploy dashboard (gRPC status, releases, nginx)"

[dependencies]
deploy-core = { path = "../deploy-core" }
deploy-db = { path = "../deploy-db" }
deploy-auth = { path = "../deploy-auth" }
deploy-proto = { path = "../../proto" }
ed25519-dalek = "2"
tonic = { version = "0.12", features = ["transport"] }
serde = { workspace = true }
serde_json = { workspace = true }
url = "2"
tokio = { version = "1", features = ["fs", "rt", "process", "io-util", "net", "time"] }
async-stream = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = { workspace = true }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
