[package]
name = "deploy-control"
version = "0.1.4"
edition = "2021"
description = "Control-plane logic for deploy dashboard (gRPC status, releases, nginx)"

[dependencies]
deploy-core = { path = "../deploy-core" }
deploy-db = { path = "../deploy-db" }
deploy-auth = { path = "../deploy-auth" }
deploy-proto = { path = "../../proto" }
ed25519-dalek = "2"
tonic = { version = "0.12", features = ["transport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["fs", "rt", "process", "io-util", "net", "time"] }
async-stream = "0.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tracing = "0.1"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
