[package]
name = "stack-tun-api"
version = "0.1.0"
edition = "2021"
description = "Queued TCP relay / tunnel coordination service (listen + connector roles)"

[[bin]]
name = "stack-tun-api"
path = "src/main.rs"

[lib]
name = "stack_tun_api"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
deploy-auth = { path = "../deploy-auth" }
deploy-proto = { path = "../../proto" }
ed25519-dalek = "2"
prost = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
base64 = { workspace = true }
parking_lot = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "net", "time", "signal"] }
tonic = { version = "0.12", features = ["transport"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
