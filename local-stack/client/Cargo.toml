[package]
name = "deploy-client"
version = "0.1.9"
edition = "2021"
autobins = false

[lib]
name = "deploy_client"
path = "src/lib.rs"

[[bin]]
name = "client"
path = "src/main.rs"

[[bin]]
name = "pirate"
path = "src/main.rs"

[[bin]]
name = "grpc-security-probe"
path = "src/bin/grpc_security_probe.rs"

[features]
default = []
experimental-quic = []

[dependencies]
deploy-auth = { path = "../../server-stack/deploy-auth" }
deploy-core = { path = "../../server-stack/deploy-core" }
deploy-proto = { path = "../../proto" }
wire-protocol = { path = "../../wire-protocol" }
prost = { workspace = true }
ed25519-dalek = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport", "tls", "tls-webpki-roots", "tls-native-roots"] }
clap = { version = "4", features = ["derive"] }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
futures-util = { workspace = true }
async-stream = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
rand_core = { workspace = true }
rand = { workspace = true }
rpassword = "7"
sysinfo = { workspace = true }
ipnet = "2"
notify = "6"
once_cell = "1"
parking_lot = { workspace = true }
xcap = "0.0.11"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
globset = "0.4"
